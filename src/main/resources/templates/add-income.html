<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Income — LedgerFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <style>
    .form-page { min-height: calc(100vh - 64px); padding: 2.5rem 0; }
    .form-card { max-width: 560px; margin: 0 auto; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container d-flex align-items-center justify-content-between">
      <a class="navbar-brand" th:href="@{/dashboard}">
        <span class="brand-icon"><i class="fas fa-chart-line"></i></span>LedgerFlow
      </a>
      <div class="d-flex align-items-center gap-2">
        <a th:href="@{/dashboard}" class="btn btn-secondary btn-sm">
          <i class="fas fa-arrow-left"></i> Dashboard
        </a>
        <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
          <i class="fas fa-moon" id="themeIcon"></i>
        </button>
      </div>
    </div>
  </nav>

  <div class="form-page">
    <div class="form-card fade-up px-3">
      <div class="mb-4">
        <h2 style="font-size:1.4rem;font-weight:700;">Add New Income</h2>
        <p style="color:var(--text-muted);font-size:0.875rem;">Record a new income entry to your ledger</p>
      </div>
      <div class="card">
        <div class="card-body">
          <form th:action="@{/income/add}" th:object="${income}" method="post">

            <div class="mb-4">
              <label class="form-label">Description</label>
              <input type="text" class="form-control" th:field="*{description}"
                     placeholder="e.g. Monthly salary, Freelance project..." required>
            </div>

            <div class="row g-3 mb-4">
              <div class="col-6">
                <label class="form-label">Amount</label>
                <input type="number" step="0.01" min="0.01" class="form-control"
                       th:field="*{amount}" placeholder="0.00" required>
              </div>
              <div class="col-6">
                <label class="form-label">Category</label>
                <select class="form-select" th:field="*{category}" required>
                  <option value="">Select category</option>
                  <option value="Salary">💼 Salary</option>
                  <option value="Freelance">💻 Freelance</option>
                  <option value="Business">🏢 Business Income</option>
                  <option value="Investment">📈 Investment Returns</option>
                  <option value="Rental">🏠 Rental Income</option>
                  <option value="Other">📋 Other</option>
                </select>
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label">Income Source <span style="color:var(--text-muted);font-weight:400;text-transform:none;">(Optional)</span></label>
              <input type="text" class="form-control" th:field="*{incomeSource}"
                     placeholder="e.g. Company Name, Client Name">
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-success flex-fill" style="justify-content:center;">
                <i class="fas fa-plus"></i> Add Income
              </button>
              <a th:href="@{/dashboard}" class="btn btn-secondary">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
