<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expenses — LedgerFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <style>
    .page-content { padding: 2rem 0 4rem; }
    .search-bar { max-width: 300px; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container d-flex align-items-center justify-content-between">
      <a class="navbar-brand" th:href="@{/dashboard}">
        <span class="brand-icon"><i class="fas fa-chart-line"></i></span>LedgerFlow
      </a>
      <div class="d-flex align-items-center gap-2">
        <a th:href="@{/dashboard}" class="btn btn-secondary btn-sm">
          <i class="fas fa-arrow-left"></i> Dashboard
        </a>
        <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
          <i class="fas fa-moon" id="themeIcon"></i>
        </button>
      </div>
    </div>
  </nav>

  <div class="container page-content">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
      <div>
        <h2 style="font-size:1.4rem;font-weight:700;margin-bottom:2px;">All Expenses</h2>
        <p style="color:var(--text-muted);font-size:0.875rem;margin:0;">Your complete expense history</p>
      </div>
      <div class="d-flex gap-2 align-items-center flex-wrap">
        <input type="search" class="form-control search-bar" id="searchInput"
               placeholder="Search expenses..." oninput="filterTable()">
        <a th:href="@{/expenses/add}" class="btn btn-primary">
          <i class="fas fa-plus"></i> Add Expense
        </a>
      </div>
    </div>

    <div class="card fade-up">
      <div class="table-responsive">
        <table class="table" id="expenseTable">
          <thead>
            <tr>
              <th>Date</th>
              <th>Description</th>
              <th>Category</th>
              <th>Type</th>
              <th class="text-end">Amount</th>
              <th class="text-center">Action</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="expense : ${expenses}">
              <td style="white-space:nowrap;color:var(--text-muted);font-size:0.85rem;"
                  th:text="${expense.expenseDate}">—</td>
              <td style="font-weight:500;" th:text="${expense.description}">—</td>
              <td><span class="badge bg-info" th:text="${expense.category}">—</span></td>
              <td>
                <span th:if="${expense.expenseType == 'FIXED'}" class="badge bg-info">Fixed</span>
                <span th:if="${expense.expenseType == 'VARIABLE'}" class="badge bg-warning">Variable</span>
              </td>
              <td class="text-end text-danger" style="font-family:'DM Mono',monospace;font-weight:600;"
                  th:text="'$' + ${expense.amount}">—</td>
              <td class="text-center">
                <a th:href="@{/expenses/delete/{id}(id=${expense.id})}"
                   class="btn btn-danger btn-sm"
                   th:onclick="'return confirmDelete(\'' + ${expense.description} + '\')'">
                  <i class="fas fa-trash"></i>
                </a>
              </td>
            </tr>
            <tr th:if="${expenses.isEmpty()}" id="emptyRow">
              <td colspan="6" class="text-center py-5" style="color:var(--text-muted);">
                <i class="fas fa-inbox d-block fa-3x mb-3" style="opacity:.2;"></i>
                No expenses found.
                <a th:href="@{/expenses/add}" style="color:var(--accent);font-weight:600;">Add your first one!</a>
              </td>
            </tr>
            <tr id="noResultsRow" style="display:none;">
              <td colspan="6" class="text-center py-4" style="color:var(--text-muted);">
                No expenses match your search.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/dashboard.js}"></script>
  <script>
    function filterTable() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const rows = document.querySelectorAll('#expenseTable tbody tr:not(#emptyRow):not(#noResultsRow)');
      let visible = 0;
      rows.forEach(r => {
        const match = r.textContent.toLowerCase().includes(q);
        r.style.display = match ? '' : 'none';
        if (match) visible++;
      });
      const noResults = document.getElementById('noResultsRow');
      if (noResults) noResults.style.display = (visible === 0 && rows.length > 0) ? '' : 'none';
    }

    function confirmDelete(name) {
      return confirm('Delete "' + name + '"? This cannot be undone.');
    }
  </script>
</body>
</html>
