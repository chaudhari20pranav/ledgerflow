<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Expense — LedgerFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <style>
    .form-page { min-height: calc(100vh - 64px); padding: 2.5rem 0; }
    .form-card { max-width: 560px; margin: 0 auto; }
    .type-option { display: none; }
    .type-label {
      display: flex; align-items: flex-start; gap: 12px;
      background: var(--bg-surface-2); border: 1.5px solid var(--border);
      border-radius: var(--radius-md); padding: 1rem 1.25rem;
      cursor: pointer; transition: var(--transition); flex: 1;
    }
    .type-label:hover { border-color: var(--accent); background: var(--accent-light); }
    .type-option:checked + .type-label {
      border-color: var(--accent); background: var(--accent-light); color: var(--accent);
    }
    .type-radio-icon {
      width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 1rem;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container d-flex align-items-center justify-content-between">
      <a class="navbar-brand" th:href="@{/dashboard}">
        <span class="brand-icon"><i class="fas fa-chart-line"></i></span>LedgerFlow
      </a>
      <div class="d-flex align-items-center gap-2">
        <a th:href="@{/dashboard}" class="btn btn-secondary btn-sm">
          <i class="fas fa-arrow-left"></i> Dashboard
        </a>
        <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
          <i class="fas fa-moon" id="themeIcon"></i>
        </button>
      </div>
    </div>
  </nav>

  <div class="form-page">
    <div class="form-card fade-up px-3">
      <div class="mb-4">
        <h2 style="font-size:1.4rem;font-weight:700;">Add New Expense</h2>
        <p style="color:var(--text-muted);font-size:0.875rem;">Record a new expense to your ledger</p>
      </div>
      <div class="card">
        <div class="card-body">
          <form th:action="@{/expenses/add}" th:object="${expense}" method="post" onsubmit="return validateExpenseForm()">

            <div class="mb-4">
              <label class="form-label">Description</label>
              <input type="text" class="form-control" th:field="*{description}"
                     placeholder="e.g. Office rent, Marketing campaign..." required>
            </div>

            <div class="row g-3 mb-4">
              <div class="col-6">
                <label class="form-label">Amount</label>
                <input type="number" step="0.01" min="0.01" class="form-control" id="amount"
                       th:field="*{amount}" placeholder="0.00" required>
              </div>
              <div class="col-6">
                <label class="form-label">Category</label>
                <select class="form-select" th:field="*{category}" required>
                  <option value="">Select category</option>
                  <option value="Rent">🏢 Rent</option>
                  <option value="Salaries">👥 Salaries</option>
                  <option value="Utilities">⚡ Utilities</option>
                  <option value="Marketing">📣 Marketing</option>
                  <option value="Supplies">📦 Supplies</option>
                  <option value="Travel">✈️ Travel</option>
                  <option value="Insurance">🛡️ Insurance</option>
                  <option value="Other">📋 Other</option>
                </select>
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label">Expense Type</label>
              <div class="d-flex gap-2 flex-wrap">
                <div style="flex:1;min-width:180px;">
                  <input type="radio" class="type-option" name="expenseType" id="fixed" value="FIXED" checked>
                  <label class="type-label" for="fixed">
                    <div class="type-radio-icon" style="background:var(--info-light);color:var(--info);">
                      <i class="fas fa-lock"></i>
                    </div>
                    <div>
                      <div style="font-weight:600;font-size:0.9rem;">Fixed</div>
                      <div style="font-size:0.78rem;color:var(--text-muted);margin-top:2px;">Recurring, predictable costs</div>
                    </div>
                  </label>
                </div>
                <div style="flex:1;min-width:180px;">
                  <input type="radio" class="type-option" name="expenseType" id="variable" value="VARIABLE">
                  <label class="type-label" for="variable">
                    <div class="type-radio-icon" style="background:var(--warning-light);color:var(--warning);">
                      <i class="fas fa-chart-line"></i>
                    </div>
                    <div>
                      <div style="font-weight:600;font-size:0.9rem;">Variable</div>
                      <div style="font-size:0.78rem;color:var(--text-muted);margin-top:2px;">Fluctuating costs</div>
                    </div>
                  </label>
                </div>
              </div>
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary flex-fill" style="justify-content:center;">
                <i class="fas fa-plus"></i> Add Expense
              </button>
              <a th:href="@{/dashboard}" class="btn btn-secondary">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
