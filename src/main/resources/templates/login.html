<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — LedgerFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; }
    .auth-layout {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-xl);
      padding: 2.5rem;
    }
    .auth-header { text-align: center; margin-bottom: 2rem; }
    .auth-logo {
      width: 48px; height: 48px;
      background: var(--accent);
      border-radius: var(--radius-md);
      display: inline-flex; align-items: center; justify-content: center;
      color: white; font-size: 1.3rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

  <!-- Minimal nav -->
  <nav class="navbar">
    <div class="container d-flex align-items-center justify-content-between">
      <a class="navbar-brand" th:href="@{/}">
        <span class="brand-icon"><i class="fas fa-chart-line"></i></span>
        LedgerFlow
      </a>
      <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
        <i class="fas fa-moon" id="themeIcon"></i>
      </button>
    </div>
  </nav>

  <div class="auth-layout">
    <div class="auth-card fade-up">
      <div class="auth-header">
        <div class="auth-logo"><i class="fas fa-chart-line"></i></div>
        <h4 style="font-weight:700;margin-bottom:4px;">Welcome back</h4>
        <p style="color:var(--text-muted);font-size:0.875rem;margin:0;">Sign in to your LedgerFlow account</p>
      </div>

      <!-- Alerts -->
      <div th:if="${param.error}" class="alert alert-danger auto-dismiss mb-3">
        <i class="fas fa-circle-exclamation me-2"></i>Invalid username or password.
      </div>
      <div th:if="${param.logout}" class="alert alert-success auto-dismiss mb-3">
        <i class="fas fa-check-circle me-2"></i>You've been logged out successfully.
      </div>
      <div th:if="${param.success}" class="alert alert-success auto-dismiss mb-3">
        <i class="fas fa-check-circle me-2"></i>Account created! Please sign in.
      </div>

      <form th:action="@{/login}" method="post">
        <div class="mb-3">
          <label class="form-label" for="username">Username</label>
          <div class="position-relative">
            <input type="text" class="form-control" id="username" name="username"
                   placeholder="your_username" required autocomplete="username">
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label" for="password">Password</label>
          <div class="position-relative">
            <input type="password" class="form-control" id="password" name="password"
                   placeholder="••••••••" required autocomplete="current-password"
                   style="padding-right:42px;">
            <button type="button" onclick="togglePwd('password','eyeIcon')"
                    style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;padding:0;">
              <i id="eyeIcon" class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 mb-3" style="justify-content:center;">
          Sign In
        </button>
      </form>

      <div class="text-center" style="color:var(--text-muted);font-size:0.875rem;">
        Don't have an account?
        <a th:href="@{/register}" style="color:var(--accent);font-weight:600;text-decoration:none;">Create one</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/dashboard.js}"></script>
  <script>
    function togglePwd(inputId, iconId) {
      const inp = document.getElementById(inputId);
      const ico = document.getElementById(iconId);
      inp.type = inp.type === 'password' ? 'text' : 'password';
      ico.className = inp.type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
    }
  </script>
</body>
</html>
